server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - every non-file path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service so the browser sees one origin
    # (no CORS preflight needed in the composed stack).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # log uploads can be large; don't cap them at nginx's 1MB default
        client_max_body_size 128m;
        proxy_read_timeout 300s;
    }
}
