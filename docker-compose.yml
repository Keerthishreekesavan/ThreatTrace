services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threattrace
      POSTGRES_PASSWORD: threattrace
      POSTGRES_DB: threattrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threattrace -d threattrace"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host by default - only the backend needs it.
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://threattrace:threattrace@db:5432/threattrace
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
